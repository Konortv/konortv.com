<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#020914">
  <title>KonorTV — Construyendo mi propio legado</title>
  <meta name="description" content="Página oficial de KonorTV. YouTube, Twitch, TikTok, Instagram, X y Discord.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <section class="hero" aria-label="KonorTV">
    <img src="banner-konortv.jpg" alt="Banner oficial de KonorTV">
  </section>

  <section class="socials" aria-label="Redes sociales">
    <a href="#" class="social youtube pending" data-name="YouTube"><span class="badge">▶</span><strong>YouTube</strong></a>
    <a href="#" class="social twitch pending" data-name="Twitch"><span class="badge">▣</span><strong>Twitch</strong></a>
    <a href="#" class="social tiktok pending" data-name="TikTok"><span class="badge">♪</span><strong>TikTok</strong></a>
    <a href="#" class="social instagram pending" data-name="Instagram"><span class="badge">◎</span><strong>Instagram</strong></a>
    <a href="#" class="social xnet pending" data-name="X"><span class="badge">𝕏</span><strong>X</strong></a>
    <a href="#" class="social discord pending" data-name="Discord"><span class="badge">●</span><strong>Discord</strong></a>
  </section>

  <section class="featured">
    <div class="video-card">
      <img src="ultimo-video.jpg" alt="Último vídeo de KonorTV">
      <span class="play">▶</span>
    </div>
    <div class="featured-copy">
      <span class="kicker">ÚLTIMO VÍDEO</span>
      <h1>EL PRÓXIMO CAPÍTULO<br><em>EMPIEZA AQUÍ.</em></h1>
      <a href="#" class="youtube-button pending"><span>▶</span> VER EN YOUTUBE <b>→</b></a>
    </div>
  </section>

  <footer>
    <div class="legacy"><span></span>CONSTRUYENDO MI PROPIO LEGADO<span></span></div>
    <small>© 2026 KonorTV</small>
  </footer>
</main>
<script src="script.js"></script>
</body>
</html>
